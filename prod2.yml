          - generic [ref=e47]: "Interactional competence in online text chat: Prefatory moves, entitlement, and contingency in L2 requests"
          - generic [ref=e48]: Xingcheng Wang & Carsten Roever
          - generic [ref=e49]: University of Melbourne
          - generic [ref=e50]: Abstract
          - generic [ref=e51]: This study explores the development of L2 learners’ interactional competence (IC) in online text chat involving request scenarios. Against the background of research on L2 IC development in spoken interaction, which had shown increased use of prefatory moves with increasing IC, we investigate how learners establish shared background knowledge in text chat through preliminary moves and whether the medium facilitates more prefatory moves at lower IC levels. We also explored how learners orient to entitlement and contingency associated with a possible grant through the selection of syntactic forms. 72 learners of English at three different proficiency levels and 16 English L1 speakers engaged in two dyadic role plays on WeChat. Online interactional data demonstrated L2 learners’ following a similar trajectory in the deployment of prefatory moves as in spoken interaction, using more prefatory moves and designing them more tightly to the interlocutor’s epistemic status as their proficiency and IC increase. Lower-level learners overwhelmingly produced I want/need or can/could structures whereas higher-level learners also used I wonder if constructions to accommodate potential contingencies related to their requests though not as systematically as native speakers. We discuss methodological and developmental implications from these findings for L2 pragmatics teaching and testing.
          - generic [ref=e52]: "Keywords: interactional competence, online interaction, text chat, intersubjectivity, requests, second language pragmatics"
          - generic [ref=e53]: Introduction
          - generic [ref=e54]: In conversational settings, interlocutors work together to construct courses of actions that unfold in a sequential manner. Pekarek Doehler (2021) defines such an ability as interactional competence (IC), which is represented by the interactant’s understanding of the interactional context and normative expectations of social practices, and the deployment of sequential tools (e.g., turn-taking) and (para)linguistic resources to engage in social actions and make moves that are locally relevant.
          - text: While participants in interaction have a multitude of options available for performing social actions, the need to establish intersubjectivity and maintain harmonious interpersonal relationships makes some options preferable to others. Research in conversation analysis over the last decade has found that interactants’ choices of actions are guided by an overt orientation to establishing an epistemic equilibrium
          - generic [ref=e55]: (Heritage, 2012a)
          - generic [ref=e56]: ensuring that all interactants have shared background knowledge and thus ensuring intersubjectivity. It has also been established that actions which potentially threaten social harmony, such as requests, are typically sequentially organized as dispreferred, with background information and affiliative moves preceding a sequentially delayed core action. Action formation of the core action is influenced by an orientation to norms of social conduct, e.g., in the recruitment of assistance by means of requests, perceptions of entitlement and contingency (Drew & Couper-Kuhlen, 2014; Fox & Heinemann, 2021; Trott & Rossano, 2020).
          - generic [ref=e57]: Prefatory moves, also termed “preliminaries”, in the pre-expansion phase prior to a core request do important double duty. On the one hand, they ensure epistemic equilibrium by giving the requestee background information necessary to react to the request. Simultaneously, they implement dispreferred sequence organization through foreshadowing but delaying the core request, allowing the requestee to signal their likely unwillingness to grant or preempt the request through an offer. However, research on the L2 development of interactional competence (IC) has repeatedly shown that lower-proficiency L2 learners provide no or limited background information (Al-Gahtani & Roever, 2012; Wu & Roever, 2021; Young, 2019), instead foregrounding the core social action. This has been attributed to processing constraints, with lower-level learners being unable to muster the linguistic resources to produce preliminary moves under the time pressure of spoken interaction (Al-Gahtani & Roever, 2018; Wu & Roever, 2021).
          - generic [ref=e58]: No previous work exists on whether a different modality, such as text chat, might reduce time pressure and thereby facilitate the provision of background information. More generally, there is no previous research with L2 learners on how epistemic equilibrium is established in this medium and how orientations to norms of social conduct are made visible.
          - text: Informed by conversation analysis (CA)
          - generic [ref=e59]: (Sacks, 1995)
          - generic [ref=e60]: ", this study aims to explore L2 English learners’ IC in online written interaction and particularly investigates how prefatory moves show an orientation to epistemic status and request formation differs based on entitlement and contingency."
          - generic [ref=e61]: Background
          - generic [ref=e62]: 2.1 Requesting in L2
          - text: When producing requests in mundane talk (but not necessarily institutional talk, see Fox, 2015), requesters tend to preface their upcoming request with preliminaries, typically explanations, accounts, checks on preconditions and pre-pres (Schegloff, 1980, 2007). These elements of dispreferred sequence organization project a prospective base first-pair part (FPP) (e.g., a request, suggestion, invitation) and mobilize recipiency
          - generic [ref=e63]: (Stivers & Rossano, 2010)
          - text: ", while allowing recipients to block the project foreshadowed by the pre-sequence or pre-empt it with a preferred action (e.g., an offer in the case of a request) (Schegloff, 2007; Sidnell, 2010). Preliminary moves can also be done through visual and non-verbal cues to “enlist someone’s assistance”"
          - generic [ref=e64]: (Drew & Couper-Kuhlen, 2014, p.17)
          - generic [ref=e65]: ", without the help having been solicited. Such (embodied) attempts to address immediate, local needs and problems are termed recruitment (see Kendrick & Drew, 2016; Schegloff, 2006 for more details)."
          - text: Pre-sequences also function to reconcile the information imbalance between interlocutors. Interactants recipient design their utterances in accordance with each other’s “territories of knowledge”
          - generic [ref=e66]: (Heritage, 2012a, p. 32)
          - text: ", to which the speaker and the recipient(s) have access to different degrees. The term ‘epistemic gradient’"
          - generic [ref=e67]: (Heritage, 2012b)
          - generic [ref=e68]: was proposed to describe the relative epistemic status between interlocutors as more knowledgeable [K+] or less knowledgeable [K-], which shifts over the course of an interaction. Epistemically, preliminaries constitute a K+ initiation, which provides background to the interlocutor, thereby creating shared knowledge and increasingly establishing intersubjectivity.
          - generic [ref=e69]: Following a pre-sequence, the core requestive action itself is typically mitigated with interrogatives, hedges and formulaic expressions, and the selection of these formatting tools has been shown to reflect the speaker’s entitlement to make the request and the contingencies that might impact its being granted (Curl & Drew, 2008; Trott & Rossano, 2020). While this has been a fruitful area of CA research, less work exists on how L2 users manage epistemics in preliminaries and orientation to entitlement and contingency in core requests.
          - text: Previous work on dispreference organization in L2 requesting has focused on pre-requests that include backgrounds and/or accounts to establish the recognizability of a potential request (Al-Gahtani, 2022; Al-Gahtani & Roever, 2012, 2014; Kobayashi & Rinnert, 2003; Taleghani-Nikazm & Huth, 2010) as part of a larger research program on pre-ness
          - generic [ref=e70]: (Schegloff, 2007)
          - generic [ref=e71]: .
          - generic [ref=e72]: These studies of L2 requests have shown clear differences between higher- and lower-IC learners. In Kobayashi and Rinnert’s (2003) cross-sectional study using role plays in the Japanese EFL context, higher-proficiency learners substantially produced a greater variety of supportive moves such as pre-pre (Can I ask you a favor?), grounders/accounts, pre-conditions (Can you speak English well?) than lower-proficiency learners in high-imposition requests. Also, higher-level learners tended to front-load those moves more often than lower-level learners and yet occasional overloaded pre-requests by higher-level learners inadvertently impaired the progressivity of the talk-in-interaction.
          - generic [ref=e73]: In a similar vein, Al-Gahtani and Roever (2012) demonstrated noticeable differences in the production of pre-expansions between upper- and lower-level Saudi learners of English, indicating a strong effect of L2 proficiency on IC. Higher-level learners often mitigated and delayed core requests by producing preparatory moves (e.g., checking availability, backgrounds, accounts, etc.) and relying on the interlocutor’s response to those moves to evaluate the likelihood of acceptance, whereas lower-level learners formulated their request first and relied on the interlocutor to elicit backgrounds or explanations before granting the request. These findings are resonant with Al-Gahtani and Roever’s (2014) longitudinal study on L2 Arabic requests, which suggested a substantial increase in the use of prefatory moves with increased proficiency. Lower-proficiency learners, who rarely did prefatory work at the outset of the study, also displayed a clear developmental pattern in their deployment of preliminaries over a 5-month period.
          - generic [ref=e74]: Lower IC interactants’ lack of prefacing not only limits their dispreference organization, but it also means that the interlocutor is not given the reason and motivation for the upcoming dispreferred action, thereby leaving them in a K- status. Learners’ development towards providing more background and frontloading it before the core request indicates that learners do orient to epistemics but are unable to make this orientation overt at lower levels. Al-Gahtani and Roever (2018) suggest that excessive cognitive processing load prevents lower-proficiency L2 interactants from constructing and deploying prefatory accounts and explanations under the time pressure of conversation whereas higher-proficiency participants are able to do so due to their faster and more automatized processing.
          - generic [ref=e75]: "Less work in L2 IC has been done on request formatting. General findings indicate that learners have a wider range of formatting options available as their IC increases and that the linguistic tools they deploy become more fine-tuned to the discourse context and interpersonal situation (Al-Gahtani & Roever, 2012, 2018; Pekarek Doehler, 2019). Only a few studies investigated learners’ possible orientation to entitlement and contingency in L2 requests (e.g., Malabarba, 2022, Youn, 2023). Youn (2023) examined how grammatical resources (e.g., complex constructions) were deployed by low-intermediate to advanced level learners in the formation of L2 requests involving varying degree of entitlement and contingencies. 102 ESL learners engaged with an interlocutor in two request scenarios: requesting a recommendation letter with a short notice (low-entitlement) and requesting advising time regarding a course project (high-entitlement). Higher-level learners consistently used more complex grammatical constructions (e.g., bi-clausal if construction such as I wonder if) to show orientation to the lack of entitlement and possible contingencies related to their requests. The result is also supported by the point biserial correlation between the use of complex syntactic constructions and participants’ role-play performance. Higher-level learners tended to produce complex syntactic constructions more frequently in the low-entitlement situation than lower-level learners (r = .58). The weaker correlation (r = .284) observed in the scenario where entitlement is already established suggests that higher-level learners may not find it imperative to use complex syntactic structures while forming the request, as the need to signal entitlement is minimal."
          - generic [ref=e76]: While previous studies have shed light on how L2 learners locally manage prefatory moves to foreshadow and mitigate imminent requests and circumvent rejections, more empirical studies are needed to clarify how epistemic status, entitlement, and contingency come into play while L2 speakers produce requests and how this would be different in computer-mediated communication (CMC).
          - generic [ref=e77]: 2.2 Entitlement and Contingency in requests
          - text: With regard to requests, entitlement is broadly defined as a requester’s rights to and expectations of the recipient’s ability and willingness to grant the request(s)
          - generic [ref=e78]: (Trott & Rossano, 2020)
          - text: . Curl and Drew (2008) found that orientation to entitlement was an important factor in request formatting, either with modals (e.g., Could you do X) or embedded modals (I wonder if you could X), in requests made through everyday calls (with friends or family members) and after-hours medical calls (with GPs). They found that the speakers’ selection of one form over the other relied on whether they were entitled to ask for help and their understanding of the contingencies surrounding the granting of the request (i.e., whether the condition to fulfill the request was met). Specifically, high entitlement and low contingency motivated Can/Could you forms, whereas low entitlement and high contingency led to I wonder if forms. Research on how the selection of request forms is regulated by speakers’ perception of their entitlement and contingency in each interactional circumstance has extended to a greater variety of interactional features and relations, including positive/negative interrogatives
          - generic [ref=e79]: (Heinemann, 2006)
          - text: ", parent-child interactions (Craven & Potter, 2010; Ogiermann, 2015), request urgency"
          - generic [ref=e80]: (Drew & Walker, 2010)
          - text: ", and experimental research on formatting preferences"
          - generic [ref=e81]: (Trott & Rossano, 2020)
          - generic [ref=e82]: . However, no work exists that investigates how displays of orientation to entitlement and contingency might develop in L2 IC, despite a growing body of work on the sequential organization and formatting of dispreferred social actions, such as requests, in L2 interactions.
          - generic [ref=e83]: 2.3 CA for CMC
          - text: Broadly, CMC refers to person-to-person communication facilitated by computer-based technologies and devices. It allows users to engage in synchronous (real-time) and asynchronous (non-concurrent) interaction across different modalities, e.g., text chat and video calls. In recent years, the use of CMC has increased dramatically and different modalities (e.g., text message, voice/video calls) have been integrated into one single platform, such as WhatsApp, WeChat, and Zoom
          - generic [ref=e84]: (Herring, 2013)
          - generic [ref=e85]: .
          - text: Various approaches and theories have been proposed to understand the similarities and dissimilarities between spoken face-to-face and written CMC interactions
          - generic [ref=e86]: (Meredith, 2020)
          - text: . Due to lack of context cues and paralinguistic features, such as body movement, gestures, facial expressions, and intonation, text-based interaction is considered to be less efficient due to its compromised rate of social exchange
          - generic [ref=e87]: (Walther, 1992)
          - text: . Since the process of composing messages is not visible to others, messages are not available until they are ‘physically’ sent to the chat, often resulting in cross-turn posting in text chat
          - generic [ref=e88]: (Garcia & Jacobs, 1999)
          - generic [ref=e89]: . The disrupted adjacency organization sometimes make written CMC equivocal and chaotic.
          - text: However, this should not be taken as that text chat is inferior to spoken communication. On the contrary, text chat and other types of CMC, due to their unique medium-specific characteristics and resources (e.g., emojis), can be examined without much dependence on spoken interaction patterns
          - generic [ref=e90]: (Meredith et al., 2021)
          - text: . Despite the inherent differences in interaction across modalities, increasingly detailed analyses of how online interactions sequentially unfold have been conducted using and drawing on CA methodology. CA-informed L2 studies have focused on a variety of interactional practices in online written interaction, such as repairs
          - generic [ref=e91]: (Tudini, 2013)
          - text: ", conversational floor and coherence (Markman, 2013; Simpson, 2013; Tudini, 2015), and openings and closings (Abe & Roever, 2019, 2020; Gonzales, 2013). Overall, findings have shown that sequential organization of online written interaction differs from that of face-to-face interaction in many aspects, depending on the type of CMC tools, the medium’s synchronicity, the number and the role of participants, and the purpose and context of the interaction. Specifically, interactional features including the turn-taking system in online text chat are not identical to that in offline spoken interaction. Due to the invisibility of message transition and possible network latency issues, turns are more split and adjacency pairs are often disrupted in text chat. However, participants generally show high tolerance to the less predictable turn-taking mechanism and compensate for the paucity of visual and auditory cues via explicit addressivity, cross-turn reference, composing shorter turns, reviewing chat logs, and using emojis. To maintain social interaction and solidarity, L2 learners also tend to disregard linguistic problems and focus on collaborative interactional work"
          - generic [ref=e92]: (Tudini, 2013)
          - generic [ref=e93]: .
          - generic [ref=e94]: Less developmental research exists on the production of pre-sequences by L2 speakers in L2 online interactions, with the only exception being Malabarba’s (2022) on deontics in WhatsApp interaction involving requests and Abe and Roever’s (2019) study on online task openings. Malabarba (2022) investigated longitudinal changes of a B1-level learner’s organized requests (“asking for answer key for non-mandatory exercises”) to the instructor. Results showed that the learner gradually reduced negotiation of deontic rights between her and the instructor and started to produce prefaces (e.g., accounts) to the request. In terms of requestive format, the learner substituted a declarative format (you can X) with a more conventional interrogative (can you X). Despite its fine-grained analysis, Malabarba (2022) provided limited insights into how learners at different L2 proficiency levels may (not) produce prefaces and modulate their requests based on different levels of entitlement and contingency. Echoing spoken L2 IC research, Abe and Roever (2019) found that the occurrence of preliminaries preceding first-idea proffer increased with L2 proficiency and extended pre-sequences were only seen in high-level learners’ chat. Abe and Roever’s (2019) study did not, however, involve role plays on social actions such as requests that typically include extensive preliminary moves for higher proficiency learners but no or less prefatory work for lower proficiency learners. Some studies (e.g., Al-Gahtani & Roever, 2018; Wu & Roever, 2021) have suggested that the absence of prefatory moves may be due to cognitive processing overload in lower proficiency learners as they have less automatized comprehension and production skills. Given the much-reduced time pressure of computer-mediated chat interaction compared to spoken interaction, we are interested in whether lower proficiency learners interacting through the medium of computer-mediated chat might show more prefatory work and fine-tuned formation of their requests.
          - generic [ref=e95]: The current study
          - generic [ref=e96]: "This CA-informed cross-sectional study aims to investigate how L2 speakers of English at three different proficiency levels do prefatory work while producing requests in online dyadic interaction. We investigate how learners’ orientation to epistemics are reflected in their preliminary moves and how entitlement and contingency might influence syntactic forms for formulating requests at different levels of L2 proficiency and IC. We are also interested in evaluating whether processing constraints on providing prefatory moves can be ameliorated by the affordances of the medium. Our research questions are:"
          - generic [ref=e97]: How does L2 proficiency affect learners’ prefatory moves including their orientation to epistemics in online request interaction?
          - generic [ref=e98]: Does the affordance of planning time in the written modality reduce proficiency effects compared to spoken interactions?
          - generic [ref=e99]: To what extent do L2 learners at different proficiency levels visibly orient to differences in entitlement and contingency in the implementation of their requests?
          - generic [ref=e100]: 4. Methodology
          - generic [ref=e101]: 4.1 Participants
          - generic [ref=e102]: A total of 72 Chinese learners of English (17 male and 55 female) and 16 English native speakers of Australian English (4 male, 12 female) participated in the study. At the time of data collection, L2 speakers were final-year high school students (22) and university students (50), with an age range from 17 to 30 years old (Mean = 22, SD = 4.03). Native speakers were also tertiary students and aged between 18 to 30 years old (Mean = 22, SD = 3.86). All L2 participants started learning English as a second language from primary school and their L2 learning experience ranged from 9 to 21 years (Mean = 13, SD = 4.25). Participants also reported their learning experience of other languages including Korean, Romanian, German, Japanese, Spanish, Malaysian, and Russian, but they had only attained beginner-intermediate proficiency in their additional language. L2 participants were divided into three proficiency levels (B1, B2, and C1 of the CEFR) based on their self-reported IELTS speaking scores (band 4-8, with Mean = 6.12, SD = .98) (see IELTS Partners, 2023, for mapping of IELTS scores on to CEFR levels). IELTS has been widely recognized as a standardized language assessment for English as a second language. In this study, participants’ IELTS speaking scores serve as an indicator of their general language proficiency that is particularly relevant to their ability to engage in social interactions. Participants also self-reported the time elapsed since they took IELTS exam, which ranged from 6 to 12 months prior to the data collection.There were 21 participants at B1 level, 29 at B2 level, and 22 at C1 level. In terms of length of residence in English-speaking countries, about 60% of L2 participants had no overseas studying/staying experience. Only fifteen L2 participants (5 B2-level and 10 C1-level learners) had study-abroad experience for over 24 months. In the group of native speakers, two participants were monolingual, while the remaining fourteen participants had studied additional languages, including Japanese, Mandarin, Malaysian, French, Italian, Hebrew, Spanish, Indonesian, Vietnamese, Korean, and German (from beginner to intermediate proficiency levels).
          - generic [ref=e103]: The role-play interlocutor was a native speaker of English who held a Master of Applied Linguistics and was trained by one of the researchers before the data collection. The use of only one interlocutor was to eliminate potential variability between different interlocutors and to standardize the interactional frame, making those interactions more comparable across participants.
          - generic [ref=e104]: 4.2 Instruments
          - generic [ref=e105]: 4.2.1 Open role-play tasks
          - generic [ref=e106]: As a part of a larger project investigating L2 learners’ IC in online written interaction, two role-play tasks involving request scenarios were administered through instant messaging platform WeChat. Role-play tasks were modelled on previously validated studies (e.g., Ikeda, 2017, 2021) and underwent several rounds of pre-pilot and pilot studies with both native speakers and specialists in the field of L2 pragmatics and IC. This iterative process ensured the authenticity and efficacy of the tasks in eliciting the target IC features. To examine how L2 speakers locally managed their interactional practices to accommodate potential entitlement and contingency while making requests, the role plays were designed to differ in entitlement and contingency (see Appendices A and B).
          - generic [ref=e107]: In the first scenario (RK1), the participant messages his/her professor to obtain a letter of recommendation to apply for an online summer camp after having sent the professor an email without a reply. The scenario stipulates that the interaction occurs late Friday night, with the application due the coming Monday. In scenario 2 (RK2), the participant messages his/her best friend Ann who lives nearby to collect a package (iPhone 12) delivered to the doorstep of his/her house.
          - generic [ref=e108]: RK1 was designed for the participant to have lower entitlement to get their request fulfilled as a professor is not required to provide a recommendation letter. In addition, the short notice of the request made it less likely that the professor would be able to provide the letter (high contingency). By contrast, in RK2 the participant had higher entitlement due to the rights and obligations of a ‘best-friend’ relationship and contingency was low, given that the interlocutor lived close by.
          - generic [ref=e109]: To ensure longer interaction and make the tasks more challenging for L2 speakers, each scenario contained additional complications only known to the role-play interlocutor. In RK1, the complication is that the interlocutor leaves early the next morning for a road trip and is unavailable until Sunday afternoon. In RK2, the interlocutor is waiting for an annual online sale which starts shortly, and it will take her about 15-20 minutes to complete the transaction.
          - generic [ref=e110]: "4.2.2 Technological affordances: WeChat"
          - generic [ref=e111]: WeChat (Tencent Holdings Limited, 2018) was selected as the text-based CMC tool in data collection for the current study, since L2 participants were from China and other popular social apps (e.g., WhatsApp, LINE, Messenger) were not downloadable at the time of data collection in mainland China. Although WeChat provides users with text- and voice-messaging and voice/video calls and conferencing, only text-based messages were allowed in the current study and none of the participants sent voice/video messages. Like many other well-known instant messaging apps (e.g., WhatsApp), user can see that the interlocutor is in the process of typing a message, but messages are not visible until they are sent to the chatting area. Other functions on WeChat such as ‘recall’ (i.e., allowing users to call back a sent message by long pressing on the message and choosing to ‘recall’) and ‘quote’ (i.e., citing a specific turn/post and responding to that through long pressing on that particular message), and how to access those functions and emojis was described in a manual given to participants prior to the data collection.
          - generic [ref=e112]: 4.3 Procedures
          - generic [ref=e113]: A WeChat group was created to conduct the role-plays. The researcher was present to facilitate task transitions. This allowed participants to perceive the interlocutor as a conversational partner, enhancing their focus on role-play tasks, while the interlocutor had flexibility to prioritize real-time interaction over a semi-structured script. After role-plays were performed, all data were immediately formatted and imported to Nvivo (QSR International Pty Ltd., 2020) where data coding and subsequent analysis of participants’ prefatory work and request forms were done.
          - generic [ref=e114]: For data analysis, we first identified the core request, which we defined as the post to which the interlocutor responded as a request. We then defined prefatory moves as posts leading up to the core request, but not including greetings, how-are-you enquiries, and other generics at the outset of the talk. We then inspected the data closely to identify tendencies in how different groups managed prefatory work with regards to its preference organization and orientation towards epistemics. These analyses addressed Research Questions 1 and 2.
          - generic [ref=e115]: "We examined the core request for its syntactic formation and coded each request as one of the following categories: declarative statements (I want/I need X), interrogatives using modals (Can/could you X?), complex constructions (e.g., I wonder if X), and interlocutor offers (i.e., offers that pre-empt the upcoming request). We then cross-tabulated request forms by groups to see if there were clear differences in the distribution of syntactic forms between the two scenarios. This analysis addressed Research Question 3."
          - generic [ref=e116]: Results
          - generic [ref=e117]: In this section we will first discuss prefatory moves in the role plays and participants’ orientation to epistemic status apparent in prefaces to the request. We will then turn to the syntactic forms of requests and the impact of entitlement and contingency on formatting. All excerpts and extracted posts are reproduced directly from the text chat, and any grammatical or spelling errors have been maintained in their original form.
          - generic [ref=e118]: 5.1 Prefatory moves
          - generic [ref=e119]: Like in spoken face-to-face interaction, prefatory moves in our data generally followed openings such as greetings, summons, and ritual exchanges (e.g., how are you?). These preliminaries could be generic (apologetic moves, checking availability, and checking email) or type-specific (pre-pre, backgrounds, and accounts).
          - generic [ref=e120]: Table 1 presents the breakdown of different types of prefatory moves used by participants in RK1 and RK2. In RK1, seven B1 learners did not preface the request with any preliminaries, whereas all higher-level learners (except one B1 learner) and NS participants produced various generic or type-specific prefatory moves to address their and the interlocutor’s epistemic gaps. In RK2, more participants tended to produce preliminaries. Only three B1, one B2, and one C1 learner refrained from any employing any preliminary moves before their base request. It is also noteworthy that, in both scenarios, higher-level learners generally produced a greater number of generic and type-specific prefatory moves than lower-level learners.
