          - generic [ref=e131]: In Excerpt 1, YX offers a greeting in post 1, followed by a request for a recommendation letter. In post 3, although the interlocutor shows her uptake of the message, she produces an adverbial enhancer exactly, implying her request for additional information. Despite this, in YX’s post 4 does not respond to the prior post as an inquiry for further information to establish intersubjectivity and as an opportunity to balance the epistemic status. This is striking considering the sufficient time gap (approximately 2 minutes) between posts 3 and 4 and the fact that YX directly quotes the interlocutor’s response. This can be compared with Excerpts 2 and 3, where higher-level learners demonstrated their abilities to construct preparatory sequences preceding their production of base requests, although the types of those preliminaries and the extent to which the prefatory work had been done varied between participants at B2 and C1 level.
