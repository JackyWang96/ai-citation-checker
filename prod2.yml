          - generic [ref=e321]: 6. Discussion
          - generic [ref=e322]: In this article, we set out to demonstrate that an interlocutor’s interactional abilities in making requests can be detected through how they organize prefatory moves and thereby actively address epistemic gaps while orienting to social harmony. Additionally, we explored how interlocutors at different proficiency levels show orientation to their rights and potential contingencies pertinent to the forthcoming requests. We found proficiency-based differences between our participants in both areas and see no indication that the lack of time pressure in the medium of chat reduced proficiency effects.
          - generic [ref=e323]: 6.1 Prefatory work in L2 requests and the role of processing
          - generic [ref=e324]: We found that lower-level learners did little prefatory work and tended to make a request directly after the greeting/ritual exchanges or produce minimal or peripheral pre-sequences (e.g., email/availability checking) prior to a base request. They thereby did not fill epistemic gaps between themselves and their interlocutor and did not attend much to relational work. As proficiency increased, the amount of prefatory work did as well, with learners providing accounts for their request, though at B2 level they sometimes still foregrounded the request itself. Only at C1 level and among NS participants were accounts preceding the request typical and relational work also became common and quite sophisticated.
          - generic [ref=e325]: This increase of prefatory work with proficiency is in line with previous studies such as Kobayashi and Rinnert (2003) and Al-Gahtani and Roever (2012) for requests and Al-Gahtani and Roever (2018) and Wu and Roever (2021) for refusals. Unlike some of these earlier studies, our study did not include very low-level learners. So, it is unlikely that even among our lowest level group a lack of linguistic resources would have played a major role in the absence of prefatory moves in their requests. A possibility that has been raised by Al-Gahtani and Roever (2018) and Wu and Roever (2021) is lower-level learners’ limited processing load, which may have pushed them to prioritize the ‘business’ and rush through the task. While this is plausible, there was no time limit for participants to role play and there were considerable time gaps (i.e., message composing time) between posts as can be seen in data. Therefore, we would argue in contrast to Al-Gahtani and Roever (2018) and Wu and Roever (2021) that L2 proficiency or other learners’ individual differences (e.g., working memory) is not likely to be a major contributor to lack of preliminary moves.
          - generic [ref=e326]: An alternative explanation for proficiency’s overriding effect on preliminaries is that the considerable effort involved in conversation for lower-level learners, even with little or no time pressure, leads learners to focus on the core message of request, discarding elements (such as accounts and affiliative moves) not crucial to this goal. Making the request early on without prefatory work gets the central task done quickly and potentially efficiently if no further negotiation is required. It also puts the onus of further enquiring about reasons for the request on the interlocutor, rather than requiring an effortful articulation of these reasons on the part of the learner, as Al-Gahtani and Roever (2012) have shown.
          - generic [ref=e327]: We do not mean to imply, however, that such a sequential organization is a strategic choice by the learners. It is more likely that lower-level learners lack members’ ‘methods’ to do relational work, implement a dispreference, and even out epistemic gradients, i.e., they may have a limited inventory of socio-culturally appropriate practices to move the interlocutor’s epistemic status in favour of the progressivity of the interaction. This may be similar to story-telling by lower-level learners, who may not mark the upcoming story as such (“Something funny happened to me today”) or situate with regard to time and place (Hellermann, 2008; Pekarek Doehler & Berger, 2018). While learners have the necessary linguistic tools available to provide background information targeting epistemic differences with the interlocutor, they may not know how to configure them for that purpose in terms of formatting and sequence organization.
          - generic [ref=e328]: By contrast, higher-level learners organized requests as dispreferred social actions and deployed more diversified techniques (e.g., apologetic moves, compliment, checking availability or email), with pre-sequences occurring in most B2-level and almost all C1-level learners’ interaction. B2-level learners often produced generic pre-sequences and occasionally post-loaded backgrounds or accounts of the request, whereas C1-level learners commonly presented type-specific pre-sequences and front-loaded them. Through adding or receiving information incrementally, high-level learners could recalibrate their understanding of the interlocutor’s epistemic status, thus deploying context-sensitive actions that fit in the ‘circumstantial details of the interaction’ in situ (Pekarek Doehler & Pochon-Berger, 2015, p. 262). However, higher-level learners occasionally oversupplied information (e.g., mentioning unanswered email in RK1) that could potentially damage social harmony and impede the progressivity of the interaction. This may indicate their ongoing development of members’ knowledge (Pekarek Doehler, 2019) and contrasts with a consistent orientation to entitlement and contingency and a larger repertoire of linguistic resources available to native speakers.
          - generic [ref=e329]: 6.2 Syntactic forms in making requests
          - generic [ref=e330]: Lower-level learners, particularly at B1-level, did not show an overt orientation to entitlement and contingency in their requests. This can be seen in their undifferentiated use of the forms I want/I need in RK1. These forms are normally produced to form “a telling rather than an asking” in service encounters, where customers/requesters display their strong entitlement to require assistance from a service provider who is commonly obliged to fulfill the request (Craven & Potter, 2010; Kendrick & Drew, 2016). However, in RK1 and RK2 the interlocutor does not have the obligation to write a letter of recommendation or collect a package for the participant and the use of those declarative forms shows lower-proficiency learners’ lack of orientation to the interlocutor’s capacity and willingness to do so.
          - generic [ref=e331]: Apart from the declarative forms, modals such as can/could you X were used by learners across all proficiency levels in both request scenarios. The occurrences of modals in RK2 (collecting a package) are expected as the requester is likely entitled to make such a request, considering the urgency, low imposition, and the close relationship between the interactants. However, by using modals in RK1, most B1- and B2-level learners and half of C1-level learners treated their request of a recommendation letter as minimally contingent and presupposed their rights to ask the interlocutor to write the letter on the weekend. They recipient designed the request to show their orientation to the interlocutor’s capability of writing a recommendation letter (can vs. cannot) rather than the contingencies such as conflicting schedules or willingness. Although the polar-question format (can/could you X) is less direct and leaves the interlocutor to decide whether to perform the requested action (Lindström, 2005), learners who invariantly used modals in both request scenarios show a lack of sensitivity for mapping linguistic forms to interactional context and locally adapting them to fit the circumstantial details.
          - generic [ref=e332]: With increased L2 proficiency and IC, learners (mostly at C1-level) displayed a stronger orientation to entitlement and contingency in their requests. Over fifty percent of C1-level learners produced embedded modals I wonder if or alike in RK1 (requesting a recommendation letter) and modals can/could you X in RK2 (requesting the collection of a package). However, the fact that only half of C1-level learners showed context-sensitivity and adjusted their choices of syntactic forms in the construction of requests shows that high proficiency is no guarantee of fine-tuned interactional performance (see also Roever & Dai, 2021). Rather, a finely tuned understanding of social norms around entitlement and contingency together with a mapping of linguistic tools to these considerations is necessary for high levels of interactional performance and proficiency alone is no guarantee.
          - generic [ref=e333]: It is also interesting that among native speakers, the low entitlement / high contingency scenario RK1 invariably elicited I wonder if or another complex construction. This almost deterministic outcome was not found in any of the learner groups. By contrast, native speaker responses showed more variation for the high entitlement / low contingency scenario RK2, as did most learner groups. This greater variation in RK2 may be due to respondents varying in their evaluation of the degree of contingency in RK2 or in their views of friends’ entitlement to make requests of each other. Alternatively, the role play instructions may have underspecified the relationship with the interlocutor in RK2, who was described as a “close friend”, but degrees of friendship may vary even among intimates, leaving the construction of the exact relationship up to the participant.
          - generic [ref=e334]: 7. Conclusion
          - generic [ref=e335]: We set out to investigate what the effect of proficiency is on the organization of request interactions through text chat. We found similar tendencies as have been described in spoken interactions, i.e., lower-level learners tended to frontload the core request whereas higher-level learners did more prefatory work and provided background knowledge, thereby demonstrating an orientation to the epistemic gradient between the interlocutor and themselves. With increasing proficiency, learners did more work to establish shared knowledge and more finely targeted their talk to the interlocutor’s knowledge status. We hypothesize that lower-level learners’ lack of prefatory moves may be due to a focus on conveying the core request message, or to a lack of member’s methods, neither of which benefitted from the greater time and lower processing demands afforded by the medium.
          - generic [ref=e336]: We also found a fairly sharp difference between lower-level learners at B1 level and higher-level learner groups in displaying an orientation to entitlement and contingency in request formation. Lower-level learners’ less diversified syntactic formatting of request and strong reliance on modals shows their developing sensitivity to entitlement and contingency and lack of form-function mapping. Higher-level groups showed a distinct leaning towards modals for the high entitlement and low contingency scenario and complex constructions for the low entitlement and high contingency scenario, evidencing greater sensitivity to entitlement and contingency.
          - generic [ref=e337]: "One limitation of our study is the limited range of entitlement and contingency levels and their combination: it would be interesting to see how learners manage scenarios with even more entitlement and less contingency, or even less entitlement and more contingency than we included. Our learners were also from a homogenous L1 background, and there may well be transfer effects in interactional performance, so it would be interesting to investigate other backgrounds as well. We also did not make learner background factors like residence or exposure a factor in our study so we cannot identify to what extent socialization plays a role and how it relates to proficiency. Future research could compare learners of similar proficiency but with different degrees of residence or experience to tease out such effects. Finally, our use of role play scenarios means that our data is not identical to natural data, especially regarding eliciting offers through pre-sequences, which was rare in our data but may occur more commonly in natural discourse. However, our data is still likely to reflect learners’ interactional abilities, which they could also deploy in real-world settings."
          - text: From a methodological standpoint, this study took a novel approach to investigating L2 speakers’ request-making abilities. Instead of relying solely on traditional context variables such as power, social distance, and imposition as outlined in politeness
          - generic [ref=e338]: theory (Brown & Levinso
          - generic [ref=e339]: n, 1987), we incorporated epistemic knowledge, entitlement, and contingency as key factors influencing the interactional strategies employed by L2 speakers at different proficiency levels. Pedagogically, language instructors can demonstrate how sequential tools (e.g., preliminary moves) and linguistic devices (e.g., diverse syntactic forms) can be used to refine social interactions. Role-play tasks serve as an effective starting point to help learners enhance their contextual sensitivity and practice these interactional tools.
