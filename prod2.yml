          - generic [ref=e194]: Table 2 shows the relative proportions of request formats for each group in each role play. All groups displayed some degree of orientation to the entitlement and contingency of the request. In RK1, learners tended to show more orientation to their lack of entitlement and possible contingencies using complex constructions (e.g., I wonder if) with increased L2 proficiency. In RK2 (high entitlement/low contingency), modals were substantially used in B1 and B2 groups (91% and 84%, respectively), and C1-level learners used modals in a majority of cases (47%) but also other formulations, such as need/want (10%) and complex constructions (31%). By contrast, NS participants did not use modals or any form other than “I wonder if” or a complex construction in the RK1. However, in RK2, the majority of NS requests were formulated with a modal (usually could) with “wonder” and other complex constructions accounting for less than 40% of their requests. No other forms (need/want) were used.
