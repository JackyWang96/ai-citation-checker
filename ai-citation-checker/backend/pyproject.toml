[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-citation-checker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-docx==1.1.2",
    "httpx==0.27.2",
    "rapidfuzz==3.9.7",
    "aiosqlite==0.20.0",
    "apscheduler==3.10.4",
    "slowapi==0.1.9",
    "pydantic==2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "respx==0.21.1",
    "ruff==0.6.1",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
